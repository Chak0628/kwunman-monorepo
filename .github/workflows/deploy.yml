name: Smart Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm@11.3.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild esbuild (ensure binary)
        run: pnpm rebuild esbuild

      - name: Build frontend
        run: cd artifacts/kwunman-os && pnpm exec vite build --emptyOutDir

      - name: Build backend
        run: cd artifacts/api-server && pnpm run build

      - name: Prepare deployment directory
        run: |
          set -e
          mkdir -p deploy-out
          echo '{ "type": "module" }' > deploy-out/package.json
          cp -r artifacts/kwunman-os/dist/* deploy-out/
          if [ -d deploy-out/public ]; then
            mv deploy-out/public/* deploy-out/
            rm -rf deploy-out/public
          fi
          mkdir -p deploy-out/api
          # 使用 pnpm deploy 自动提取后端及其所有运行时依赖 (添加 --legacy)
          pnpm --filter @workspace/api-server deploy deploy-out/api --legacy
          cat > deploy-out/api/\[...path\].js << 'EOF'
          export default async function handler(req, res) {
            if (req.url === '/api/debug') {
              return res.status(200).json({
                sessionSecretSet: !!process.env.SESSION_SECRET,
                envKeys: Object.keys(process.env).filter(k => !k.startsWith('npm_')).slice(0, 10),
              });
            }

            try {
              const { default: app } = await import('./index.mjs');
              return new Promise((resolve, reject) => {
                app(req, res, (err) => {
                  if (err) return reject(err);
                  resolve();
                });
              });
            } catch (error) {
              res.status(500).json({ error: error.message, stack: error.stack });
            }
          }
          EOF
          cat > deploy-out/vercel.json << 'EOF'
          {
            "rewrites": [
              { "source": "/api/(.*)", "destination": "/api/[...path]" },
              { "source": "/(.*)", "destination": "/index.html" }
            ]
          }
          EOF

      - name: Debug - show deploy-out structure
        run: |
          echo "=== deploy-out root ==="
          ls -la deploy-out/
          echo "=== deploy-out/api ==="
          ls -la deploy-out/api/

      - name: Deploy to Vercel
        run: |
          cd deploy-out
          rm -rf .vercel
          npx vercel link --project kwunman-monorepo --token ${{ secrets.VERCEL_TOKEN }} --yes
          npx vercel deploy --prod --token ${{ secrets.VERCEL_TOKEN }} --yes