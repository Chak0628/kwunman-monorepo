name: Deploy to Vercel (Local Prebuilt)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy prebuilt static files to Vercel
        run: |
          cd artifacts/kwunman-os
          # 确保 dist 存在（由本地构建并提交）
          if [ ! -d "dist" ]; then
            echo "Error: dist folder not found. Please build locally first."
            exit 1
          fi
          # 准备 Vercel 输出目录
          mkdir -p .vercel/output/static
          cp -r dist/* .vercel/output/static/
          if [ -d .vercel/output/static/public ]; then
            mv .vercel/output/static/public/* .vercel/output/static/
            rm -rf .vercel/output/static/public
          fi
          echo '{ "rewrites": [ { "source": "/(.*)", "destination": "/index.html" } ] }' > .vercel/output/static/vercel.json
          echo '{ "version": 3 }' > .vercel/output/config.json
          # 部署
          npx vercel deploy --prod --prebuilt --token ${{ secrets.VERCEL_TOKEN }} --yes