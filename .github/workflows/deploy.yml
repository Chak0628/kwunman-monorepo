name: Smart Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm@11.3.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild esbuild (ensure binary)
        run: pnpm rebuild esbuild

      - name: Build frontend
        run: cd artifacts/kwunman-os && pnpm exec vite build --emptyOutDir

      - name: Build backend
        run: cd artifacts/api-server && pnpm run build

      - name: Prepare prebuilt output
        run: |
          set -e

          # === 静态文件 ===
          mkdir -p .vercel/output/static
          cp -r artifacts/kwunman-os/dist/* .vercel/output/static/
          if [ -d .vercel/output/static/public ]; then
            mv .vercel/output/static/public/* .vercel/output/static/
            rm -rf .vercel/output/static/public
          fi
          cat > .vercel/output/static/vercel.json << 'EOF'
          {
            "rewrites": [
              { "source": "/api/(.*)", "destination": "https://kwunman-monorepo.onrender.com/api/$1" },
              { "source": "/(.*)", "destination": "/index.html" }
            ]
          }
          EOF

          # === API 函数 ===
          FUNC_DIR=.vercel/output/functions/api/[...path].func
          mkdir -p $FUNC_DIR

          # 使用 pnpm deploy 安装后端运行时依赖到临时目录
          pnpm --filter @workspace/api-server deploy tmp-api --legacy

          # 复制所有文件（包括 node_modules）到函数目录
          cp -r tmp-api/* $FUNC_DIR/
          rm -rf tmp-api

          # 关键修复：添加极简 package.json 声明 ESM，但无依赖项，防止 Vercel 安装
          cat > $FUNC_DIR/package.json << 'EOF'
          {
            "type": "module"
          }
          EOF

          # 生成函数入口文件 (index.js)
          cat > $FUNC_DIR/index.js << 'EOF'
          export default async function handler(req, res) {
            if (req.url === '/api/debug') {
              return res.status(200).json({
                sessionSecretSet: !!process.env.SESSION_SECRET,
                envKeys: Object.keys(process.env).filter(k => !k.startsWith('npm_')).slice(0, 10),
              });
            }

            try {
              const { default: app } = await import('./dist/index.mjs');
              return new Promise((resolve, reject) => {
                app(req, res, (err) => {
                  if (err) return reject(err);
                  resolve();
                });
              });
            } catch (error) {
              res.status(500).json({ error: error.message, stack: error.stack });
            }
          }
          EOF

          # 函数配置
          cat > $FUNC_DIR/.vc-config.json << 'EOF'
          {
            "runtime": "nodejs22.x",
            "handler": "index.js",
            "includeFiles": "**/*"
          }
          EOF

          # === 根 config.json（包含 API 代理） ===
          cat > .vercel/output/config.json << 'EOF'
          {
            "version": 3,
            "routes": [
              {
                "src": "/api/(.*)",
                "dest": "https://kwunman-monorepo.onrender.com/api/$1"
              }
            ]
          }
          EOF

      - name: Deploy to Vercel (Prebuilt)
        run: |
          npx vercel deploy --prod --prebuilt --token ${{ secrets.VERCEL_TOKEN }} --yes