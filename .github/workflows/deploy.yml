      - name: Prepare deployment directory
        run: |
          set -e
          mkdir -p deploy-out
          echo '{ "type": "module" }' > deploy-out/package.json
          cp -r artifacts/kwunman-os/dist/* deploy-out/
          if [ -d deploy-out/public ]; then
            mv deploy-out/public/* deploy-out/
            rm -rf deploy-out/public
          fi
          mkdir -p deploy-out/api
          cp -r artifacts/api-server/dist/* deploy-out/api/
          # 复制后端 package.json 并安装生产依赖（解决运行时缺少包的问题）
          cp artifacts/api-server/package.json deploy-out/api/
          cd deploy-out/api
          npm install --production --no-audit --no-fund
          cd ../../..
          cat > deploy-out/api/\[...path\].js << 'EOF'
          export default async function handler(req, res) {
            if (req.url === '/api/debug') {
              return res.status(200).json({
                sessionSecretSet: !!process.env.SESSION_SECRET,
                envKeys: Object.keys(process.env).filter(k => !k.startsWith('npm_')).slice(0, 10),
              });
            }

            try {
              const { default: app } = await import('./index.mjs');
              return new Promise((resolve, reject) => {
                app(req, res, (err) => {
                  if (err) return reject(err);
                  resolve();
                });
              });
            } catch (error) {
              res.status(500).json({ error: error.message, stack: error.stack });
            }
          }
          EOF
          cat > deploy-out/vercel.json << 'EOF'
          {
            "rewrites": [
              { "source": "/api/(.*)", "destination": "/api/[...path]" },
              { "source": "/(.*)", "destination": "/index.html" }
            ]
          }
          EOF