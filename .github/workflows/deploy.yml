name: Smart Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm@11.3.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild esbuild (ensure binary)
        run: pnpm rebuild esbuild

      - name: Build frontend
        run: cd artifacts/kwunman-os && pnpm exec vite build --emptyOutDir

      - name: Build backend
        run: cd artifacts/api-server && pnpm run build

      - name: Prepare deployment directory
        run: |
          set -e

          # 创建临时部署目录
          mkdir -p deploy-out

          # 复制前端静态文件
          cp -r artifacts/kwunman-os/dist/* deploy-out/
          # 如果存在 public 子目录，将其内容移到根目录
          if [ -d deploy-out/public ]; then
            mv deploy-out/public/* deploy-out/
            rm -rf deploy-out/public
          fi

          # 复制后端构建产物到 api/ 目录（作为函数体）
          mkdir -p deploy-out/api
          cp -r artifacts/api-server/dist/* deploy-out/api/
          # 创建 API 入口文件，从同级目录导入 index.mjs
          echo "import app from './index.mjs'; export default app;" > deploy-out/api/\[...path\].js

          # 创建 vercel.json（SPA 路由 + API 重写）
          cat > deploy-out/vercel.json << 'EOF'
          {
            "rewrites": [
              { "source": "/api/(.*)", "destination": "/api/[...path]" },
              { "source": "/(.*)", "destination": "/index.html" }
            ]
          }
          EOF

      - name: Deploy to Vercel
        run: |
          cd deploy-out
          npx vercel deploy --prod --token ${{ secrets.VERCEL_TOKEN }} --yes