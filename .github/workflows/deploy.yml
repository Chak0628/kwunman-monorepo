name: Smart Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm@11.3.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild esbuild (ensure binary)
        run: pnpm rebuild esbuild

      - name: Build frontend
        run: pnpm --filter @workspace/kwunman-os run build

      - name: Build backend
        run: pnpm --filter @workspace/api-server run build

      - name: Prepare Vercel output
        run: |
          mkdir -p .vercel/output/static
          cp -r artifacts/kwunman-os/dist/* .vercel/output/static/
          if [ -d .vercel/output/static/public ]; then
            mv .vercel/output/static/public/* .vercel/output/static/
            rm -rf .vercel/output/static/public
          fi
          echo '{ "rewrites": [ { "source": "/(.*)", "destination": "/index.html" } ] }' > .vercel/output/static/vercel.json

          mkdir -p .vercel/output/functions/api/[...path].func
          cp -r artifacts/api-server/dist/* .vercel/output/functions/api/[...path].func/
          echo "import app from './index.mjs'; export default app;" > .vercel/output/functions/api/[...path].func/index.js
          echo '{ "runtime": "nodejs22.x", "includeFiles": "**/*" }' > .vercel/output/functions/api/[...path].func/.vc-config.json

          echo '{ "version": 3 }' > .vercel/output/config.json
          echo '{ "routes": [ { "src": "/api/(.*)", "dest": "/api/[...path]" } ] }' >> .vercel/output/config.json

      - name: Deploy to Vercel
        run: |
          npx vercel deploy --prod --prebuilt --token ${{ secrets.VERCEL_TOKEN }} --yes