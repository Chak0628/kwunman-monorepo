        status:
          type: string
      required:
        - status

    # ─── PROJECT ──────────────────────────────────────────────────────────────
    Project:
      type: object
      required:
        - id
        - quoteId
        - date
        - location
        - projectItem
        - quoteAmount
        - client
        - clientId
        - status
        - depositStatus
        - startDate
        - endDate
        - invoiceStatus
        - finalReceived
        - balanceStatus
        - taxQuarterKwunman
        - taxQuarterGov
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        quoteId:
          type: string
          description: Quote number e.g. "Q001"
        date:
          type: ["string", "null"]
          description: Quote issue date YYYY-MM-DD
        location:
          type: string
        projectItem:
          type: string
        quoteAmount:
          type: number
        client:
          type: string
        clientId:
          type: string
        status:
          type: string
          enum: ["報價中", "待通知", "待收首期", "施工中", "待收款", "待收尾期", "已完成", "不成功"]
        depositStatus:
          type: string
        startDate:
          type: ["string", "null"]
        endDate:
          type: ["string", "null"]
        invoiceStatus:
          type: string
        finalReceived:
          type: number
        balanceStatus:
          type: string
          enum: ["待收尾數", "已收齊", "無"]
        taxQuarterKwunman:
          type: string
        taxQuarterGov:
          type: string
        projectType:
          type: ["string", "null"]
        paymentTerms:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        totalPaid:
          type: number
