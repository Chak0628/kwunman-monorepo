openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: KwunMan OS - 冠文鋼結構管理系統 API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Project (quote) management
  - name: clients
    description: Client database
  - name: expenses
    description: Expense reimbursement
  - name: dashboard
    description: Dashboard summary data
  - name: auth
    description: Authentication
  - name: users
    description: User account management
  - name: schedules
    description: Employee work schedules
  - name: payslips
    description: Payslip management
  - name: note-templates
    description: Shared note/remarks templates
  - name: expense-categories
    description: Expense category management
  - name: expense-merchants
    description: Merchant management for expenses
  - name: chem-forms
    description: 個人墊支申請 (Chem Forms)
  - name: Storage
    description: Object storage upload and serving endpoints

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── DASHBOARD ────────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard KPI summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/pending-balance:
    get:
      operationId: getPendingBalance
      tags: [dashboard]
      summary: List projects pending balance collection
      responses:
        "200":
          description: List of projects with pending balance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"

  # ─── PROJECTS ─────────────────────────────────────────────────────────────────
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects with optional filters
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: ["報價中", "待通知", "待收首期", "施工中", "待收款", "待收尾期", "已完成", "不成功"]
        - name: taxView
          in: query
          schema:
            type: string
            enum: ["kwunman", "gov"]
        - name: quarter
          in: query
          schema:
            type: string
        - name: client
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project / quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/next-id:
    get:
      operationId: getNextProjectId
      tags: [projects]
      summary: Get the next auto-incremented project ID
      responses:
        "200":
          description: Next project ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NextProjectId"

  /projects/quarterly-stats:
    get:
      operationId: getQuarterlyStats
      tags: [projects]
      summary: Get quarterly financial statistics
      parameters:
        - name: taxView
          in: query
          required: true
          schema:
            type: string
            enum: ["kwunman", "gov"]
      responses:
        "200":
          description: Quarterly statistics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuarterlyStat"

  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a single project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /projects/{projectId}/mark-received:
    post:
      operationId: markProjectReceived
      tags: [projects]
      summary: Mark project balance as fully received
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                receivedDate:
                  type: ["string", "null"]
                finalReceived:
                  type: ["number", "null"]
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  # ─── INVOICES ─────────────────────────────────────────────────────────────────
  /invoices:
    get:
      operationId: listInvoices
      tags: [projects]
      summary: List invoices, optionally filtered by quoteId
      parameters:
        - name: quoteId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
    post:
      operationId: createInvoice
      tags: [projects]
      summary: Create a new invoice for a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceInput"
      responses:
        "201":
          description: Created invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/next-no:
    get:
      operationId: getNextInvoiceNo
      tags: [projects]
      summary: Get next auto-incremented invoice number
      responses:
        "200":
          description: Next invoice number
          content:
            application/json:
              schema:
                type: object
                required: [nextNo]
                properties:
                  nextNo:
                    type: string

  /invoices/{invoiceId}:
    patch:
      operationId: updateInvoice
      tags: [projects]
      summary: Update an invoice (e.g. mark as paid)
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceUpdate"
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
    delete:
      operationId: deleteInvoice
      tags: [projects]
      summary: Delete an invoice
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── PAYMENTS ─────────────────────────────────────────────────────────────────
  /payments:
    get:
      operationId: listPayments
      tags: [projects]
      summary: List payments for a project
      parameters:
        - name: quoteId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"
    post:
      operationId: createPayment
      tags: [projects]
      summary: Add a payment record to a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Created payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /payments/{paymentId}:
    delete:
      operationId: deletePayment
      tags: [projects]
      summary: Delete a payment record
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── QUOTE ITEMS ──────────────────────────────────────────────────────────────
  /quote-items:
    get:
      operationId: listQuoteItems
      tags: [projects]
      summary: List line items for a quote
      parameters:
        - name: quoteId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of quote items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuoteItem"
    post:
      operationId: createQuoteItem
      tags: [projects]
      summary: Add a line item to a quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteItemInput"
      responses:
        "201":
          description: Created quote item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteItem"

  /quote-items/{itemId}:
    patch:
      operationId: updateQuoteItem
      tags: [projects]
      summary: Update a line item
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteItemUpdate"
      responses:
        "200":
          description: Updated quote item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteItem"
    delete:
      operationId: deleteQuoteItem
      tags: [projects]
      summary: Delete a line item
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── CLIENTS ──────────────────────────────────────────────────────────────────
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List all clients
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a new client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Created client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/{clientId}:
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete a client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # ─── EXPENSES ─────────────────────────────────────────────────────────────────
  /expenses:
    get:
      operationId: listExpenses
      tags: [expenses]
      summary: List all expenses
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: ["pending", "approved", "rejected"]
        - name: projectId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"
    post:
      operationId: createExpense
      tags: [expenses]
      summary: Create an expense claim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Created expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"

  /expenses/{expenseId}:
    patch:
      operationId: updateExpense
      tags: [expenses]
      summary: Update expense (e.g. approve/reject)
      parameters:
        - name: expenseId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseUpdate"
      responses:
        "200":
          description: Updated expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
    delete:
      operationId: deleteExpense
      tags: [expenses]
      summary: Delete an expense
      parameters:
        - name: expenseId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── EXPENSE CATEGORIES ────────────────────────────────────────────────────────
  /expense-categories:
    get:
      operationId: listExpenseCategories
      tags: [expense-categories]
      summary: List all expense categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpenseCategory"
    post:
      operationId: createExpenseCategory
      tags: [expense-categories]
      summary: Create an expense category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseCategoryInput"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseCategory"

  /expense-categories/{categoryId}:
    patch:
      operationId: updateExpenseCategory
      tags: [expense-categories]
      summary: Update an expense category
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseCategoryInput"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseCategory"
    delete:
      operationId: deleteExpenseCategory
      tags: [expense-categories]
      summary: Delete an expense category
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── EXPENSE MERCHANTS ─────────────────────────────────────────────────────────
  /expense-merchants:
    get:
      operationId: listExpenseMerchants
      tags: [expense-merchants]
      summary: List all expense merchants
      responses:
        "200":
          description: List of merchants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpenseMerchant"
    post:
      operationId: createExpenseMerchant
      tags: [expense-merchants]
      summary: Create an expense merchant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseMerchantInput"
      responses:
        "201":
          description: Created merchant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseMerchant"

  /expense-merchants/{merchantId}:
    patch:
      operationId: updateExpenseMerchant
      tags: [expense-merchants]
      summary: Update an expense merchant
      parameters:
        - name: merchantId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseMerchantInput"
      responses:
        "200":
          description: Updated merchant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseMerchant"
    delete:
      operationId: deleteExpenseMerchant
      tags: [expense-merchants]
      summary: Delete an expense merchant
      parameters:
        - name: merchantId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── CHEM FORMS ────────────────────────────────────────────────────────────────
  /chem-forms:
    get:
      operationId: listChemForms
      tags: [chem-forms]
      summary: List all Chem Form submissions
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: ["pending", "approved", "rejected"]
        - name: submitterId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of Chem Forms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChemForm"
    post:
      operationId: createChemForm
      tags: [chem-forms]
      summary: Submit a new Chem Form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChemFormInput"
      responses:
        "201":
          description: Created Chem Form
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChemForm"

  /chem-forms/{chemFormId}:
    get:
      operationId: getChemForm
      tags: [chem-forms]
      summary: Get a single Chem Form with items and receipts
      parameters:
        - name: chemFormId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Chem Form with items and receipts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChemFormDetail"
    patch:
      operationId: updateChemForm
      tags: [chem-forms]
      summary: Update or approve/reject a Chem Form
      parameters:
        - name: chemFormId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChemFormUpdate"
      responses:
        "200":
          description: Updated Chem Form
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChemForm"
    delete:
      operationId: deleteChemForm
      tags: [chem-forms]
      summary: Delete a Chem Form
      parameters:
        - name: chemFormId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /chem-forms/{chemFormId}/receipts:
    get:
      operationId: listChemFormReceipts
      tags: [chem-forms]
      summary: List receipts for a Chem Form
      parameters:
        - name: chemFormId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of receipts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChemFormReceipt"
    post:
      operationId: addChemFormReceipt
      tags: [chem-forms]
      summary: Add a receipt to a Chem Form
      parameters:
        - name: chemFormId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChemFormReceiptInput"
      responses:
        "201":
          description: Added receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChemFormReceipt"

  # ─── OBJECT STORAGE ────────────────────────────────────────────────────────────
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ─── NOTE TEMPLATES ────────────────────────────────────────────────────────────
  /note-templates:
    get:
      operationId: listNoteTemplates
      tags: [note-templates]
      summary: List all note templates
      responses:
        "200":
          description: List of templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NoteTemplate"
    post:
      operationId: createNoteTemplate
      tags: [note-templates]
      summary: Create a note template (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteTemplateInput"
      responses:
        "201":
          description: Created template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteTemplate"

  /note-templates/{templateId}:
    put:
      operationId: updateNoteTemplate
      tags: [note-templates]
      summary: Update a note template (admin only)
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteTemplateInput"
      responses:
        "200":
          description: Updated template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteTemplate"
    delete:
      operationId: deleteNoteTemplate
      tags: [note-templates]
      summary: Delete a note template (admin only)
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── AUTH ─────────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current session
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the currently logged-in user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated

  # ─── USERS ────────────────────────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all user accounts
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppUser"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppUserInput"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUser"

  /users/{userId}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user account
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppUserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
